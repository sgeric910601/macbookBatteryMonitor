# 推送到 main 或開 PR 時測試並編譯通用版（Apple 晶片與 Intel）。
# 發布 Release（標題與說明取自 .github/release-notes/<tag>.md，第一行為標題）：
#   - 推送到 main 時，若 Info.plist 的版本 v<版本> 還沒有 Release、且有對應說明檔，就在該 commit 建立 tag 並發布
#   - Info.plist 帶 MBMPrerelease（例如 beta.1）時 tag 是 v<版本>-beta.1，標成預先發行版本：
#     正式版的一鍵更新與通知不會用到，只有使用者手動檢查更新時才找得到
#   - 推送 v* tag，或手動執行並填入 tag
name: 編譯與發布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 要發布的版本 tag（例如 v1.2.0），留空則依 Info.plist 的版本
        required: false

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: 編譯
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 測試
        run: Scripts/test-power.sh
      - name: 編譯通用版並驗證簽章與架構
        run: |
          ./build.sh
          codesign --verify --deep --strict build/macbookBatteryMonitor.app
          lipo -archs build/macbookBatteryMonitor.app/Contents/MacOS/macbookBatteryMonitor | grep -q x86_64
          lipo -archs build/macbookBatteryMonitor.app/Contents/MacOS/macbookBatteryMonitor | grep -q arm64
      - name: 打包 DMG
        run: Scripts/make-dmg.sh build/macbookBatteryMonitor.app build/macbookBatteryMonitor.dmg

  release:
    if: ${{ github.event_name != 'pull_request' }}
    name: 發布
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: 判斷是否發布
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
            # 沒有這個 key 時 macOS 15 的 plutil 會把錯誤印到標準輸出，所以看結束碼，不看輸出
            prerelease="$(plutil -extract MBMPrerelease raw -o - Resources/Info.plist 2>/dev/null)" || prerelease=""
            [[ -n "$prerelease" ]] && tag="$tag-$prerelease"
            if [[ ! -f ".github/release-notes/$tag.md" ]]; then
              echo "沒有 .github/release-notes/$tag.md，不發布"
              tag=""
            fi
          fi
          if [[ -n "$tag" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已經發布過"
            tag=""
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "要發布的版本：${tag:-無}"
      - name: 測試
        if: ${{ env.TAG != '' }}
        run: Scripts/test-power.sh
      - name: 編譯並打包
        if: ${{ env.TAG != '' }}
        # 給人下載、也給 v1.7.2 起的一鍵更新用的 DMG（macOS 14 以上的通用版），檔名固定不帶版本號。
        # 另附舊版一鍵更新認得的 zip：
        #   - battery／status zip：每一版都附。v1.5.0～v1.6.2 只看最新版本，有這兩個檔案才能直接更新到最新版
        #     （內容相同，只有 MBMEdition 不同，用來保留原本的系統監控設定；也是兩種晶片通用）
        #   - 通用版 zip：只有過渡版 v1.7.2 附。v1.7.1 會看最近的版本，找得到 status zip 或 v1.7.2 的通用版 zip
        run: |
          ./build.sh universal
          codesign --verify --deep --strict build/macbookBatteryMonitor.app
          Scripts/make-dmg.sh build/macbookBatteryMonitor.app macbookBatteryMonitor.dmg
          if [[ "$TAG" == v1.7.2 ]]; then
            ditto -c -k --sequesterRsrc --keepParent build/macbookBatteryMonitor.app "macbookBatteryMonitor-${TAG}-macOS-universal.zip"
          fi
          for edition in battery status; do
            ./build.sh "$edition"
            codesign --verify --deep --strict build/macbookBatteryMonitor.app
            ditto -c -k --sequesterRsrc --keepParent build/macbookBatteryMonitor.app "macbookBatteryMonitor-${TAG}-${edition}-macOS-arm64.zip"
          done
      - name: 編譯並打包舊系統版本（macOS 12 起）
        if: ${{ env.TAG != '' }}
        # legacy-macos12 分支的版本號和這次發布相同時，才把它的 DMG 放進同一個 Release
        run: |
          if ! git fetch --depth=1 origin legacy-macos12; then
            echo "沒有 legacy-macos12 分支，這次不附舊系統版本"
            exit 0
          fi
          git worktree add ../legacy FETCH_HEAD
          legacy="v$(plutil -extract CFBundleShortVersionString raw -o - ../legacy/Resources/Info.plist)"
          legacy_prerelease="$(plutil -extract MBMPrerelease raw -o - ../legacy/Resources/Info.plist 2>/dev/null)" || legacy_prerelease=""
          [[ -n "$legacy_prerelease" ]] && legacy="$legacy-$legacy_prerelease"
          if [[ "$legacy" != "$TAG" ]]; then
            echo "舊系統版本是 ${legacy}，和 ${TAG} 不同，這次不附"
            exit 0
          fi
          cd ../legacy
          Scripts/test-power.sh
          ./build.sh legacy
          codesign --verify --deep --strict build/macbookBatteryMonitor.app
          "$GITHUB_WORKSPACE/Scripts/make-dmg.sh" build/macbookBatteryMonitor.app "$GITHUB_WORKSPACE/macbookBatteryMonitor-macOS12.dmg"
          if [[ "$TAG" == v1.7.2 ]]; then
            ditto -c -k --sequesterRsrc --keepParent build/macbookBatteryMonitor.app "$GITHUB_WORKSPACE/macbookBatteryMonitor-${TAG}-macOS12.zip"
          fi
      - name: 建立 Release
        if: ${{ env.TAG != '' }}
        run: |
          # 一鍵更新會用這個校驗檔確認下載的 DMG（v1.7.1 是 zip）沒有損壞
          shopt -s nullglob
          files=(macbookBatteryMonitor*.dmg macbookBatteryMonitor-"$TAG"-*.zip)
          shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          # v1.8.0-beta.1 這種 tag 標成預先發行版本，不會變成「最新版本」
          flags=()
          [[ "$TAG" == *-* ]] && flags=(--prerelease --latest=false)
          notes=".github/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            title="$(head -n 1 "$notes" | sed 's/^# *//')"
            tail -n +3 "$notes" > release-body.md
            gh release create "$TAG" "${files[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" --title "$title" --notes-file release-body.md "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${flags[@]}"
          fi
